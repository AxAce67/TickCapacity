report.section.hardware=Hardware & environment
report.section.method=Method
report.method=**Observed estimate:** samples (default 10 s windows) are grouped by online player count. Per group, the median of mean MSPT and of p95 MSPT is taken to suppress spikes. A weighted linear model `MSPT = base + k × players` is fitted, and the player counts where it reaches the comfortable and limit thresholds are solved, with confidence intervals from the regression's confidence band. Confidence is graded by extrapolation distance, number of distinct player counts and interval width. With enough player counts, an upward-curving quadratic model is also fitted and used when it is clearly better (AICc), so the limit is not optimistic when the server degrades faster near saturation.\n\n**Benchmark estimate:** virtual players (ticking chunk areas plus mobs) are added in stages in a dedicated world with a fixed seed. Each stage is measured after a settle period. Thresholds crossed during the run are interpolated between stages; otherwise the fitted line is extrapolated. Synthetic load is an approximation and is never graded above "medium".

