advice.mspt-over-limit=Reduce load (see the other findings) or lower the player limit.
advice.main-thread-waiting=Possible causes: slow disk I/O, CPU steal on a shared VPS, or another process competing for CPU.
advice.system-cpu-saturated=Other processes or servers on this machine are competing for CPU. Check the host.
advice.gc-heavy=Increase -Xmx if RAM allows, use Aikar's flags or ZGC, and check for memory-hungry plugins.
advice.heap-pressure=Increase the heap (-Xmx) or reduce loaded chunks and entities.
advice.lag-spikes=Usually caused by autosaves, chunk generation or GC. Pre-generate the world and check the GC findings.
advice.many-entities=Limit mob farms, use entity limits and adjust mob-spawn caps.
advice.many-block-entities=Limit hopper chains and large automatic farms.
advice.many-chunks-per-player=Check for force-loaded chunks, spawn chunks and plugins that keep chunks loaded.
advice.reduce-simulation-distance=Lowering simulation-distance (for example to 6) greatly reduces per-player cost while keeping view-distance.
advice.few-cores=Paper uses extra threads for chunk loading and GC. At least 2 to 4 threads are recommended.
advice.small-heap=At least 4 GB is recommended for a public server.

