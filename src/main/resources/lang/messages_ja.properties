advice.mspt-over-limit=他の指摘を参考に負荷を減らすか、最大人数を下げてください。
advice.main-thread-waiting=考えられる原因: ディスク I/O が遅い、共有 VPS で CPU を他の利用者に取られている（steal）、別のプロセスと CPU を取り合っている。
advice.system-cpu-saturated=同じマシン上の別プロセスや別サーバーと CPU を取り合っています。ホスト側を確認してください。
advice.gc-heavy=メモリに余裕があれば -Xmx を増やし、Aikar's flags か ZGC を使い、メモリを多く使うプラグインがないか確認してください。
advice.heap-pressure=ヒープ（-Xmx）を増やすか、読み込むチャンクやエンティティを減らしてください。
advice.lag-spikes=多くは自動保存・チャンク生成・GC が原因です。ワールドを事前生成し、GC についての指摘も確認してください。
advice.many-entities=Mob トラップを制限し、エンティティ数の上限や Mob のスポーン上限を調整してください。
advice.many-block-entities=長いホッパーの連結や大規模な自動化装置を制限してください。
advice.many-chunks-per-player=強制読み込みチャンク、スポーンチャンク、チャンクを読み込んだままにするプラグインがないか確認してください。
advice.reduce-simulation-distance=simulation-distance を下げる（例: 6）と、view-distance はそのままで1人あたりの負荷を大きく減らせます。
advice.few-cores=Paper はチャンク読み込みや GC にも別スレッドを使います。2〜4 スレッド以上を推奨します。
advice.small-heap=公開サーバーでは 4 GB 以上を推奨します。

