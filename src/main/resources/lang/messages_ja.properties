report.method=**実データによる推定:** サンプル（標準では10秒ごと）をオンライン人数ごとにまとめ、各人数での平均 MSPT と p95 MSPT の中央値をとってスパイクの影響を抑えます。そのうえで重み付き線形モデル `MSPT = 基礎負荷 + k × 人数` を当てはめ、快適ラインと限界ラインに達する人数を求めます。区間は回帰直線の信頼帯から計算します。信頼度は、外挿の距離、人数の種類の数、区間の幅で判定します。 人数の種類が十分にある場合は、上向きに曲がる二次式のモデルも当てはめ、明らかに良いとき（AICc で判定）はそちらを使います。これにより、限界付近で急に重くなるサーバーでも、限界人数が甘くなりにくくなります。\n\n**ベンチマークによる推定:** シードを固定した専用ワールドで、仮想プレイヤー（ティックするチャンク範囲と Mob）を段階的に増やします。各段階は安定待ちの後に測定します。測定中にしきい値を超えた場合は前後の段階から補間し、超えなかった場合は当てはめた直線から外挿します。疑似負荷はあくまで近似なので、信頼度は「中」より上にはなりません。

